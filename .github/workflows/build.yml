name: build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # net8.0 builds the Jellyfin 10.10/10.11 line, net10.0 the Jellyfin 12 line.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Three-part release number. The fourth component is NOT taken from the
          # tag: it is the server-line marker that the csproj assigns per target
          # framework (see PluginRevision there).
          NUM_VERSION="${VERSION%%-*}"
          IFS=. read -r a b c _ <<< "$NUM_VERSION"
          echo "base=${a:-0}.${b:-0}.${c:-0}" >> "$GITHUB_OUTPUT"

      # The csproj is the single source of truth for the version. A tag that
      # disagrees with it would publish artifacts whose assembly version and
      # manifest entry differ, so fail loudly instead.
      - name: Verify tag matches csproj PluginVersion (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CSPROJ_VERSION="$(dotnet msbuild -getProperty:PluginVersion -p:TargetFramework=net8.0 -nologo)"
          if [[ "${CSPROJ_VERSION}" != "${{ steps.ver.outputs.base }}" ]]; then
            echo "::error::tag says ${{ steps.ver.outputs.base }} but csproj PluginVersion is ${CSPROJ_VERSION}"
            exit 1
          fi

      - name: Build, stage and zip both server lines
        run: |
          BASE="${{ steps.ver.outputs.base }}"
          echo '[]' > "${RUNNER_TEMP}/artifacts.json"

          for TFM in net8.0 net10.0; do
            # Keep the framework -> revision/ABI mapping in the csproj only.
            PROPS="$(dotnet msbuild -getProperty:PluginRevision -getProperty:PluginTargetAbi \
                       -p:TargetFramework="$TFM" -nologo)"
            REV="$(jq -er .Properties.PluginRevision <<< "$PROPS")"
            ABI="$(jq -er .Properties.PluginTargetAbi <<< "$PROPS")"
            NUM="${BASE}.${REV}"

            dotnet publish -c Release -f "$TFM" -o "./publish/$TFM"

            mkdir -p "./out/$TFM"
            cp "./publish/$TFM/Jellyfin.Plugin.LanguageAwareImages.dll" "./out/$TFM/"
            cp "./publish/$TFM/TMDbLib.dll" "./out/$TFM/"
            jq --arg v "$NUM" --arg abi "$ABI" --arg fw "$TFM" \
               '.version = $v | .targetAbi = $abi | .framework = $fw' \
               meta.json > "./out/$TFM/meta.json"

            ZIP="language-aware-images_${NUM}.zip"
            (cd "./out/$TFM" && zip -r "../../${ZIP}" .)
            CHECKSUM="$(md5sum "${ZIP}" | awk '{print $1}')"
            echo "built ${ZIP} (targetAbi ${ABI}, md5 ${CHECKSUM})"

            jq --arg v "$NUM" --arg abi "$ABI" --arg zip "$ZIP" --arg cs "$CHECKSUM" \
               '. += [{version: $v, targetAbi: $abi, zip: $zip, checksum: $cs}]' \
               "${RUNNER_TEMP}/artifacts.json" > "${RUNNER_TEMP}/artifacts.json.new"
            mv "${RUNNER_TEMP}/artifacts.json.new" "${RUNNER_TEMP}/artifacts.json"
          done

      - name: Upload zips as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: language-aware-images_*.zip

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the tagged commit's full message as release notes. If somehow
          # empty (rare), fall back to a minimal placeholder.
          git log -1 --format='%B' HEAD > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${{ steps.ver.outputs.version }}" > /tmp/release-notes.md
          fi

          gh release create "${GITHUB_REF#refs/tags/}" \
            language-aware-images_*.zip \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes-file /tmp/release-notes.md

      - name: Update manifest.json (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF#refs/tags/}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Race protection: parallel pushes (main-branch workflow, developer
          # push between checkout and our push) can move origin between our
          # build and our manifest push. We can't rebase a manifest edit
          # (they're guaranteed to conflict on the same JSON region), so each
          # retry hard-resets to origin/main and re-applies the jq mutation
          # against the freshest state. artifacts.json lives in RUNNER_TEMP so
          # the reset can't take it with it.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # One entry per server line, highest version first. Jellyfin keeps
            # every entry whose targetAbi <= the server version and installs the
            # highest, so both lines coexist in one feed.
            jq --slurpfile arts "${RUNNER_TEMP}/artifacts.json" \
               --arg ts "$TIMESTAMP" --arg repo "$REPO" --arg tag "$TAG" '
              (($arts[0] | reverse) | map({
                  version: .version,
                  changelog: ("Release " + .version),
                  targetAbi: .targetAbi,
                  sourceUrl: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/" + .zip),
                  checksum: .checksum,
                  timestamp: $ts
                })) as $new
              | ($new | map(.version)) as $newVersions
              | .[0].versions = ($new + [.[0].versions[] | select(.version as $v | $newVersions | index($v) | not)])
            ' manifest.json > manifest.json.new
            mv manifest.json.new manifest.json

            git add manifest.json
            git commit -m "chore: publish ${TAG} to manifest [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push attempt $attempt failed, retrying after 3s"
            sleep 3
          done
          echo "manifest push failed after 3 attempts"
          exit 1
